spring.application.name=rentease-api
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rentease?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rentease}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
rentease.jwt.secret=${RENTEASE_JWT_SECRET}
rentease.jwt.expiration-ms=${RENTEASE_JWT_EXPIRATION_MS:900000}
rentease.cors.allowed-origins=${RENTEASE_CORS_ORIGINS:http://localhost:5173}
rentease.admin.email=${RENTEASE_ADMIN_EMAIL:}
rentease.admin.password=${RENTEASE_ADMIN_PASSWORD:}
logging.level.org.springframework.security=WARN
